name: Deploy Next.js Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Don't let two deploys race; cancel an in-progress one when a newer push lands.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Buildx enables GitHub Actions layer caching for fast rebuilds.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # LOGIN TO GHCR (machine user) — for pushing the image.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_BOT_USERNAME }}
          password: ${{ secrets.CI_BOT_TOKEN }}

      # BUILD & PUSH FRONTEND IMAGE (NEXT_PUBLIC_* are baked at build time).
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_DEVICE_FINGERPRINT_STORAGE_KEY=${{ secrets.NEXT_PUBLIC_DEVICE_FINGERPRINT_STORAGE_KEY }}
            NEXT_PUBLIC_DEVICE_NAME_STORAGE_KEY=${{ secrets.NEXT_PUBLIC_DEVICE_NAME_STORAGE_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/bentojo/bento-fe:latest
            ghcr.io/bentojo/bento-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DEPLOY TO VPS — log in to GHCR there too (needed for a private package),
      # then pull + recreate. Fails the job if the container isn't healthy.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /apps/bento-fe
            docker compose pull
            docker compose up -d
            docker image prune -f
            # quick sanity check: container is running
            sleep 3
            docker compose ps
            test "$(docker inspect -f '{{.State.Running}}' bento-fe)" = "true"
        env:
          GHCR_USER: ${{ secrets.CI_BOT_USERNAME }}
          GHCR_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
