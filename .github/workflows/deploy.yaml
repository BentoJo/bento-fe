name: Deploy Next.js Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Don't let two deploys race; cancel an in-progress one when a newer push lands.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The server builds the image from source (podman, local build), so the
      # deploy just syncs the repo and rebuilds. NEXT_PUBLIC_* come from the
      # server-side .env (build args); NEXTAUTH_* from .env at runtime.
      - name: Deploy to VPS (build on server)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /apps/bento-fe
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build --force-recreate
            docker image prune -f
            # Poll the healthcheck instead of a single one-shot curl: a fresh
            # container can take >5s to start serving, which used to fail the
            # deploy even though it actually came up.
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                echo "FE is up on :3000 (after ${i} attempt(s))"
                exit 0
              fi
              echo "waiting for FE to come up... (${i}/20)"
              sleep 3
            done
            echo "FE did not respond on :3000 within ~60s"
            docker compose logs --tail=40 || true
            exit 1
