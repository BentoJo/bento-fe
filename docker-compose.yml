# Reference compose for deploying bento-fe on the VPS (/apps/bento-fe).
#
# The image is built + pushed to GHCR by .github/workflows/deploy.yaml.
# On the VPS you only PULL + run it (no source there) — do NOT add `build:`.
#
# NEXT_PUBLIC_* values are baked into the image at BUILD time (workflow build-args).
# The variables below are RUNTIME server secrets that next-auth needs and that
# must NOT be baked into the image. Put them in a `.env` file NEXT TO this compose
# on the VPS (chmod 600) — docker compose auto-loads it for ${...} interpolation:
#
#   # /apps/bento-fe/.env
#   NEXTAUTH_URL=https://app.manejo.io        # the PUBLIC url of the app (https, real host)
#   NEXTAUTH_SECRET=<openssl rand -base64 32> # strong 32+ char secret
#
# The container listens on 3000 and is bound to localhost only — put a reverse
# proxy (nginx/Caddy/Traefik) in front for TLS that forwards to 127.0.0.1:3000.

services:
  bento-fe:
    image: ghcr.io/bentojo/bento-fe:latest
    container_name: bento-fe
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
